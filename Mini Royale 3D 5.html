<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Royale 3D</title>
<style>
:root{--bg:#efeaff;--fg:#1d1738;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120e24;--fg:#efeaff}}
:root[data-theme="dark"]{--bg:#120e24;--fg:#efeaff}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#box{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:none}
#ov{position:absolute;inset:0;display:flex;color:#fff;text-align:center;cursor:default}
#ov h2{margin:0;font-size:2.2rem}
#ov p{margin:0;max-width:30rem;line-height:1.5}
#lobbyTopBar{position:absolute;top:0;left:0;right:0;height:52px;background:linear-gradient(180deg,#0a0618e8,transparent);display:flex;align-items:center;gap:22px;padding:0 20px;font:800 .85rem "Trebuchet MS",sans-serif}
#lobbyLogo{font:italic 900 1.15rem "Impact","Arial Black",sans-serif;color:#ffe14d;transform:skewX(-8deg)}
#lobbyTabs{display:flex;gap:20px;color:#cbbfe0}
#lobbyTabs span{cursor:default;opacity:.65}
#lobbyTabs span.on{opacity:1;color:#ffe14d;border-bottom:2px solid #ffe14d;padding-bottom:4px}
#lobbyCount{margin-left:auto;font:900 .85rem "Trebuchet MS",sans-serif;background:#000a;border:1px solid #ffd21f66;color:#ffe9b0;padding:5px 14px;border-radius:14px;white-space:nowrap}
#lobbyPanel{position:absolute;left:0;bottom:0;width:min(360px,50vw);display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:26px 22px;box-sizing:border-box;text-align:left}
#lobbyTop{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:10px}
#lobbyTop h2{font-size:1.5rem}
#lobbyTop p{text-align:left;font-size:.82rem;color:#cbbfe0}
#modeCard{display:flex;align-items:center;gap:10px;background:#1c1430d0;border:1px solid #7c3aed55;border-radius:8px;padding:8px 14px 8px 8px;margin-bottom:10px}
#modeIcon{width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#3d7bff);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex:none}
#lobbyMode{font:900 1rem "Trebuchet MS",sans-serif;color:#fff;letter-spacing:.03em;line-height:1.2}
#lobbyModeSub{font:700 .78rem "Trebuchet MS",sans-serif;color:#9d8fc2}
#lobbyGear{width:30px;height:30px;border-radius:50%;background:#1c1430b0;border:1px solid #7c3aed55;display:flex;align-items:center;justify-content:center;font-size:.95rem;margin-left:8px;flex:none}
#rankBadge{position:absolute;right:16px;bottom:14px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#ffd21f 60%,#b45309);display:flex;align-items:center;justify-content:center;font:900 1rem "Trebuchet MS",sans-serif;color:#3a2a00;border:2px solid #fff6;box-shadow:0 0 10px #ffd21f88}
#lobbyHints{position:absolute;right:68px;bottom:16px;font:700 .72rem "Trebuchet MS",sans-serif;color:#cbbfe0cc;text-align:right;line-height:1.6}
#lobbySub{display:none;position:absolute;left:0;right:0;top:54px;bottom:0;background:#0a0618d8;padding:30px 8vw;box-sizing:border-box;overflow:auto;color:#fff;text-align:left}
#lobbySub h3{font:italic 900 1.6rem "Impact","Arial Black",sans-serif;color:#ffe14d;margin:0 0 16px;transform:skewX(-6deg)}
#lobbySub .row{display:flex;align-items:center;gap:12px;background:#1c1430aa;border:1px solid #ffffff22;border-radius:8px;padding:10px 16px;margin-bottom:8px;font:700 .9rem "Trebuchet MS",sans-serif}
#lobbySub .row b{color:#ffe14d;min-width:120px;display:inline-block}
#lobbySub .muted{color:#b9adcf;font:700 .85rem "Trebuchet MS",sans-serif;margin-top:10px}
#lobbySub .cardRow{display:flex;gap:14px;flex-wrap:wrap}
#lobbySub .card{width:140px;background:#1c1430;border:1px solid #ffffff22;border-radius:8px;padding:14px;text-align:center;font:700 .82rem "Trebuchet MS",sans-serif;opacity:.7}
#lobbySub .card .ic{font-size:2.2rem;margin-bottom:6px}
#lobbyBack{position:absolute;left:8vw;bottom:24px;padding:8px 20px;background:#ffffff18;border:1px solid #fff5;border-radius:6px;font:900 .85rem "Trebuchet MS",sans-serif;cursor:pointer}
#ov.off{display:none}
#hud{position:absolute;left:12px;top:12px;width:190px;color:#fff;font-size:.85rem;text-shadow:0 1px 2px #000;pointer-events:none}
.bar{height:12px;background:#0007;border-radius:6px;overflow:hidden;margin-bottom:5px}
.bar i{display:block;height:100%;width:100%;background:#5be37d}
.bar.w i{background:#e0a458}
#scope{position:absolute;inset:0;display:none;background:
  radial-gradient(circle at center,transparent 0,transparent 27%,#000 27.6%) ;}
#scope.on{display:block}
#scope:before,#scope:after{content:'';position:absolute;background:#000c;}
#scope .ring{position:absolute;left:50%;top:50%;width:54vmin;height:54vmin;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #0008;box-shadow:0 0 0 2000px #000;}
#scope .cross{position:absolute;left:50%;top:50%;width:1px;height:54vmin;background:#000;transform:translate(-50%,-50%)}
#scope .cross2{position:absolute;left:50%;top:50%;width:54vmin;height:1px;background:#000;transform:translate(-50%,-50%)}
#scope .reticle{position:absolute;left:50%;top:50%;width:2px;height:2px;background:#ff3b3b;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 4px #ff3b3b}
#scope .hint{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);color:#fff;font:700 .85rem "Trebuchet MS",sans-serif;text-shadow:0 1px 2px #000;opacity:.8}
#cross{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;display:none;border:2px solid #fff;border-radius:50%;box-sizing:border-box;background:radial-gradient(#fff 0 2px,transparent 3px);mix-blend-mode:difference}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:3.5rem;font-weight:bold;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none}
#btns{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:10px}
#btns button{width:78px;height:78px;border-radius:50%;border:2px solid #fff;background:#6c3df4cc;color:#fff;font:bold .82rem "Trebuchet MS",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#cross.lock{border-color:#ff4d4d;mix-blend-mode:normal;background:radial-gradient(#ff4d4d 0 2px,transparent 3px)}
#mini{position:absolute;right:12px;top:12px;width:178px;height:178px;border-radius:10px;border:2px solid #fff9;background:#0009;box-shadow:0 5px 18px #0008;pointer-events:none}
#chips{position:absolute;right:12px;top:202px;display:flex;flex-direction:column;align-items:stretch;gap:5px;pointer-events:none;min-width:178px}
#chips .chip{font:800 .82rem 'Trebuchet MS',sans-serif;letter-spacing:.02em;transform:none;text-align:left;padding:6px 10px;border:1px solid #ffffff40;border-left:3px solid #ffe14d;border-bottom-width:1px;border-radius:5px;background:#090817df;text-shadow:0 1px 2px #000}
#compassWrap{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(70vw,460px);height:26px;overflow:hidden;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
#compassWrap::after{content:'';position:absolute;left:50%;top:0;width:2px;height:100%;background:#ffe14d;transform:translateX(-50%)}
#compass{position:absolute;top:2px;height:22px;display:flex;white-space:nowrap;font:900 .8rem "Trebuchet MS",sans-serif;color:#fff;text-shadow:0 1px 2px #000}
#compass span{display:inline-block;width:46px;text-align:center}
#killFeed{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:260px}
#killFeed div{background:#000a;border-left:3px solid #ffe14d;padding:3px 10px;font:700 .78rem "Trebuchet MS",sans-serif;color:#eee;border-radius:3px;opacity:0;transition:opacity .4s}
#killFeed div.show{opacity:1}
#chips{position:absolute;right:12px;top:170px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.chip{font:italic 900 1.15rem "Impact","Arial Black",sans-serif;color:#fff;background:#000a;padding:4px 14px;transform:skewX(-10deg);text-shadow:0 2px 0 #0006;border-bottom:3px solid #ffd21f}
.chip.st{background:#5b21b6d0;border-color:#c084fc}
#bottom{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:flex-end;gap:14px;pointer-events:none}
#hpbox{width:min(300px,50vw);color:#fff;font:italic 900 1.4rem "Impact","Arial Black",sans-serif;text-shadow:0 2px 0 #0008}
#hpbox .bar{height:18px;transform:skewX(-14deg);border-radius:2px;border:2px solid #0008;background:#000a;margin:2px 0 0}
#hpbox .bar i{background:linear-gradient(#7dff8a,#25b43c)}
#slots{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.slot{width:46px;height:46px;background:#000a;border:2px solid #fff5;display:flex;align-items:center;justify-content:center;font:900 .68rem "Trebuchet MS",sans-serif;color:#fff;transform:skewX(-8deg);cursor:pointer;text-align:center;line-height:1.05;padding:2px}
.slot.locked{opacity:.55;cursor:default}
.slot.on{box-shadow:0 0 0 3px #fff,0 0 12px 2px #fffb;transform:skewX(-8deg) scale(1.1)}
#wood{display:flex;align-items:center;gap:6px;font:italic 900 1.3rem "Impact","Arial Black",sans-serif;color:#fff;background:#000a;padding:4px 10px;border-bottom:3px solid #ffb347;transform:skewX(-10deg)}
.wi{width:18px;height:18px;background:linear-gradient(90deg,#c48a4a 50%,#a06a30 50%);border:2px solid #5a3a18}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,#7c3aed00 45%,#7c3aedcc 100%)}
#killFlash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,#ffe14d55 0%,transparent 70%)}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(20,12,5,.38) 100%)}
.dm{position:absolute;font:italic 900 1.5rem "Impact","Arial Black",sans-serif;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;animation:up .7s ease-out forwards}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-50px);opacity:0}}
#ov h2{font:italic 900 1.8rem "Impact","Arial Black",sans-serif;transform:skewX(-8deg);color:#ffe14d;text-shadow:0 3px 0 #b45309,0 0 14px #0009;letter-spacing:.03em;margin:0}
#play{margin-top:8px;padding:6px 0;width:58%;font:italic 900 .88rem "Impact","Arial Black",sans-serif;background:#ffe14d;color:#111;transform:skewX(-8deg);border-bottom:3px solid #b45309;box-shadow:0 0 10px #ffd21f33}
#msg{font:italic 900 4rem "Impact","Arial Black",sans-serif;color:#ffe14d;text-shadow:0 4px 0 #b45309,0 0 14px #000}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font:900 1.05rem "Trebuchet MS",sans-serif;color:#fff;background:#000c;padding:8px 16px;border-radius:8px;border:2px solid #ffe14d;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#pickupHint{position:absolute;left:50%;top:58%;transform:translateX(-50%);font:900 .85rem "Trebuchet MS",sans-serif;color:#fff;background:#000a;padding:6px 14px;border-radius:7px;border:2px solid #4ade80;display:none;pointer-events:none}
#modeBadge{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:900 .85rem "Trebuchet MS",sans-serif;color:#fff;background:#000a;padding:5px 16px;border-radius:7px;border:2px solid #3d9dff;pointer-events:none;z-index:5}
#modeBadge.bm{border-color:#ffe14d}
#bk{background:#3d1f6b}
#pickupHint b{color:#ffe14d}
#toast.show{opacity:1;transform:translateX(-50%) translateY(6px)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* Victory screen: original battle-royale-inspired banner */
#msg.victory-msg{top:23%;left:50%;right:auto;width:min(94%,720px);transform:translateX(-50%);font-size:1rem;color:#fff;text-shadow:none;z-index:30;}
.victory-banner{position:relative;isolation:isolate;overflow:hidden;padding:clamp(16px,3vw,28px) clamp(12px,3vw,32px) 18px;transform:skewX(-7deg);border:2px solid #8de7ff;border-right:8px solid #1764b7;border-bottom:7px solid #103e85;border-radius:8px;background:linear-gradient(112deg,#0d2c78f5 0%,#1d76d8f5 35%,#143c91f5 68%,#061a4cf5 100%);box-shadow:0 12px 0 #071a3caa,0 0 24px #44c7ffbb,inset 0 0 22px #b7efff55;animation:victory-in .65s cubic-bezier(.16,1,.3,1) both;}
.victory-banner:before{content:"";position:absolute;z-index:-1;inset:-40%;background:repeating-linear-gradient(125deg,transparent 0 28px,#8de7ff22 30px 34px,transparent 36px 62px);transform:translateX(-18%);animation:victory-shine 2.8s ease-in-out infinite;}
.victory-banner:after{content:"✦   ✧      ✦       ✧   ✦";position:absolute;inset:7px 10px auto;text-align:right;color:#d9f7ff99;font-size:clamp(10px,2vw,18px);letter-spacing:8px;}
.victory-number{display:block;font:italic 1000 clamp(2.8rem,8vw,5.2rem)/.85 Impact,"Arial Black",sans-serif;letter-spacing:-.04em;color:#ffe95b;text-shadow:0 3px 0 #c57b09,0 6px 0 #633c05,0 0 14px #fff4a0;}
.victory-title{display:block;margin-top:9px;font:italic 1000 clamp(1.4rem,5vw,3.1rem)/.98 Impact,"Arial Black",sans-serif;letter-spacing:.035em;color:#fff;text-shadow:0 3px 0 #15509b,0 0 12px #c4f5ff;}
.victory-sub{margin-top:13px;padding:7px 10px;display:inline-block;background:linear-gradient(90deg,#ffe65b,#ffb52b);color:#18254a;font:900 clamp(.75rem,2.2vw,1rem)/1.1 "Trebuchet MS",sans-serif;letter-spacing:.06em;box-shadow:0 3px 0 #8a4d09;}
.victory-count{margin-top:12px;color:#fff;font:800 clamp(.75rem,2vw,1rem) "Trebuchet MS",sans-serif;text-shadow:0 2px 3px #00112c;}
.victory-msg .victory-banner>*{transform:skewX(7deg);}
@keyframes victory-in{0%{opacity:0;transform:translateY(-45px) skewX(-7deg) scale(.72)}65%{opacity:1;transform:translateY(5px) skewX(-7deg) scale(1.03)}100%{transform:translateY(0) skewX(-7deg) scale(1)}}
@keyframes victory-shine{0%,100%{translate:-8% 0;opacity:.4}50%{translate:8% 0;opacity:1}}
@media(max-width:520px){#msg.victory-msg{top:27%;width:92%}.victory-banner{padding:15px 10px 13px;border-right-width:5px;border-bottom-width:5px}}

#fpsCounter{position:fixed;left:50%;bottom:5px;transform:translateX(-50%);z-index:9999;font:9px/1.2 Arial,sans-serif;color:rgba(255,255,255,.72);text-shadow:0 1px 2px #000;background:rgba(0,0,0,.22);padding:2px 4px;border-radius:3px;pointer-events:none;letter-spacing:.2px;white-space:nowrap}
</style>
</head>
<body>
<div id="box">
<div id="vig"></div>
<div id="fpsCounter">FPS: --</div>
<div id="killFlash"></div>
<div id="vign"></div>
<canvas id="mini" width="150" height="150"></canvas>
<div id="compassWrap"><div id="compass"></div></div>
<div id="killFeed"></div>
<div id="chips"><div class="chip" id="alive"></div><div class="chip" id="kills"></div><div class="chip st" id="zone"></div></div>
<div id="slots"><div class="slot on" id="sl1">1</div><div class="slot" id="sl2">2</div><div class="slot" id="sl3">3</div><div class="slot" id="sl4">4</div><div class="slot" id="sl5">5</div><div class="slot locked" id="sl6">🔒</div></div>
<div id="bottom"><div id="hpbox"><div style="display:flex;justify-content:space-between"><b id="spn">0</b><b id="hpn">100</b></div><div class="bar" style="background:#0007;margin-bottom:3px"><i id="shield" style="background:#3d9dff"></i></div><div class="bar"><i id="hp"></i></div></div><div id="wood"><span class="wi"></span><b id="wn">100</b></div></div>
<div id="cross"></div>
<div id="scope"><div class="ring"></div><div class="cross"></div><div class="cross2"></div><div class="reticle"></div><div class="hint">G zum Zoomen</div></div>
<div id="msg"></div>
<div id="toast"></div>
<div id="pickupHint"></div>
<div id="btns"><button id="bf">Feuer</button><button id="bb">Wand</button><button id="bs">Treppe</button><button id="bfl">Boden</button><button id="bj">Sprung</button><button id="bp">Nehmen</button><button id="bk">🔨 Baumodus</button></div>
<div id="modeBadge">🎯 KAMPFMODUS</div>
<div id="ov">
  <div id="lobbyTopBar"><span id="lobbyLogo">🏹 MINI ROYALE</span>
    <div id="lobbyTabs"><span class="on" data-tab="play">▶ SPIELEN</span><span data-tab="locker">🎭 SPIND</span><span data-tab="shop">🛒 SHOP</span><span data-tab="pass">🎫 PÄSSE</span><span data-tab="quest">📜 AUFGABEN</span><span data-tab="rank">🏆 RANGLISTE</span><span data-tab="settings">⚙️ EINSTELLUNGEN</span><span data-tab="help">❓ ERKLÄRUNG</span></div>
    <div id="lobbyCount">👥 Lade…</div><div id="lobbyGear">⚙️</div></div>
  <div id="lobbyPanel">
    <div id="lobbyTop"><h2 id="t">Mini Royale 3D</h2><p id="s"></p></div>
    <div id="modeCard"><div id="modeIcon">⚔️</div><div><div id="lobbyMode">BATTLE ROYALE</div><div id="lobbyModeSub">▾ Solo</div></div></div>
    <div id="play">SPIELEN</div>
  </div>
  <div id="lobbyHints">🎯 Zielfernrohr (G) · 🧱 Bauen (E) · 🪜 Treppe (R)<br>🎒 Loot: B zum Aufheben · ⤴️ Springen (C)</div>
<div id="lobbySub"></div>
  <div id="rankBadge">1</div>
</div>
</div>
<script>
window.addEventListener('error',function(e){
  var box=document.getElementById('box');
  var d=document.createElement('div');
  d.style.cssText='position:absolute;inset:0;z-index:9999;background:#2a0a0ae8;color:#fff;font:700 15px monospace;padding:18px;overflow:auto;white-space:pre-wrap';
  d.textContent='⚠️ Fehler beim Laden des Spiels:\n\n'+(e.message||'unbekannt')+'\n\nDatei: '+(e.filename||'?')+'  Zeile: '+(e.lineno||'?')+':'+(e.colno||'?')+'\n\n(Bitte diesen Text kopieren und an Claude schicken.)';
  if(box)box.appendChild(d);else document.body.appendChild(d);
});
window.addEventListener('unhandledrejection',function(e){
  var box=document.getElementById('box');
  var d=document.createElement('div');
  d.style.cssText='position:absolute;inset:0;z-index:9999;background:#2a0a0ae8;color:#fff;font:700 15px monospace;padding:18px;overflow:auto;white-space:pre-wrap';
  d.textContent='⚠️ Fehler (Promise):\n\n'+(e.reason&&e.reason.message?e.reason.message:String(e.reason));
  if(box)box.appendChild(d);else document.body.appendChild(d);
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,BS=4,AR=800,DZ=0,BX=.3,GY=1.6;
let GFX_Q=2;try{const gq=parseInt(localStorage.getItem('mr3d_gfxQ'));if(gq>=0&&gq<=3)GFX_Q=gq;}catch(e){}
// Four scalable quality levels; the top mode targets richer shadows, longer view distance and denser vegetation.
const GFX_PRESETS=[{shadow:512,fogFar:520,treeMul:.25,dpr:1},{shadow:768,fogFar:720,treeMul:.46,dpr:1.2},{shadow:1024,fogFar:850,treeMul:.64,dpr:1.35},{shadow:3072,fogFar:1850,treeMul:1.65,dpr:1.65}];
function setGfxQ(q){GFX_Q=Math.max(0,Math.min(3,q|0));try{localStorage.setItem('mr3d_gfxQ',GFX_Q);}catch(e){}
  const p=GFX_PRESETS[GFX_Q];
  if(typeof R!=='undefined'){R.setPixelRatio(Math.min(devicePixelRatio,p.dpr));R.setSize(W||box.clientWidth,H||box.clientHeight,false);if(R.shadowMap)R.shadowMap.needsUpdate=true;}
  if(typeof scene!=='undefined'&&scene.fog)scene.fog.far=p.fogFar;scene.fog.near=GFX_Q===3?520:210;R.toneMappingExposure=GFX_Q===3?1.18:1.08;
  if(typeof sun!=='undefined'&&sun.shadow){sun.intensity=GFX_Q===3?1.7:1.55;sun.shadow.mapSize.set(p.shadow,p.shadow);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}sun.shadow.needsUpdate=true;}
}

const $=id=>document.getElementById(id);
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');
const box=$('box'),ov=$('ov'),btns=$('btns'),cross=$('cross'),msg=$('msg');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,GFX_PRESETS[GFX_Q].dpr));

function canBuild(kind,p){if(p.wood<10||p.bcd>0)return false;
  const gx=Math.floor((p.x+p.ax*5)/BS),gz=Math.floor((p.z+p.az*5)/BS),key=kk(gx,gz);
  const arr=stairs.get(key)||[];
  if(kind==='stair'){if(arr.some(st=>Math.abs(st.base-p.y)<BS*.6)||walls.has(key))return false;}
  else{if(walls.has(key)||arr.length)return false;}
  const wx=gx*BS+2,wz=gz*BS+2;
  if(Math.abs(p.x-wx)<2.7&&Math.abs(p.z-wz)<2.7)return false;
  for(const b of bots)if(Math.abs(b.x-wx)<2.7&&Math.abs(b.z-wz)<2.7)return false;
  return{gx,gz};}
function build(kind){const p=S.p;const ok=canBuild(kind,p);if(!ok)return;
  if(kind==='stair')addStair(ok.gx,ok.gz,nearestDir(p.ax,p.az),p.y,100);else addWall(ok.gx,ok.gz,100,kind,p.y,nearestDir(p.ax,p.az));

let particles=[];
function burst(x,y,z,color,count,spread){
  for(let i=0;i<count;i++){
    const m=new T.Mesh(new T.BoxGeometry(.16,.16,.16),new T.MeshBasicMaterial({color,transparent:true,opacity:1}));
    m.position.set(x,y,z);
    const a=Math.random()*6.283,up=1+Math.random()*2.5,sp=spread*(.5+Math.random()*.7);
    particles.push({m,vx:Math.cos(a)*sp,vy:up*2.2,vz:Math.sin(a)*sp,life:.7,max:.7});
    scene.add(m);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const pt=particles[i];
    pt.life-=dt;pt.vy-=9*dt;
    pt.m.position.x+=pt.vx*dt;pt.m.position.y+=pt.vy*dt;pt.m.position.z+=pt.vz*dt;
    pt.m.rotation.x+=dt*6;pt.m.rotation.y+=dt*6;
    pt.m.material.opacity=Math.max(0,pt.life/pt.max);
    if(pt.life<=0){scene.remove(pt.m);particles.splice(i,1);}
  }
}

function drawMini(){
  const Wm=mini.width,Hm=mini.height;
  mctx.clearRect(0,0,Wm,Hm);
  const sc=Wm/(AR*2),tx=x=>(x+AR)*sc,tz=z=>(z+AR)*sc;
  // Top-down stylized map: land, terrain bands, roads and the three settlement areas.
  const bg=mctx.createLinearGradient(0,0,Wm,Hm);bg.addColorStop(0,'#477d50');bg.addColorStop(.5,'#315d45');bg.addColorStop(1,'#254b3b');
  mctx.fillStyle=bg;mctx.fillRect(0,0,Wm,Hm);
  // Terrain contours give the minimap a readable overhead-map feel.
  for(let i=0;i<7;i++){
    mctx.beginPath();mctx.ellipse(Wm*(.18+(i%3)*.32),Hm*(.2+((i*7)%6)*.12),Wm*(.13+i*.018),Hm*(.09+i*.012),i*.48,0,Math.PI*2);
    mctx.strokeStyle=i%2?'rgba(188,213,135,.16)':'rgba(20,38,32,.22)';mctx.lineWidth=1;mctx.stroke();
  }
  // Roads match the main world's hub-and-three-settlements layout.
  const road=(x1,z1,x2,z2)=>{mctx.beginPath();mctx.moveTo(tx(x1),tz(z1));mctx.lineTo(tx(x2),tz(z2));mctx.strokeStyle='#282d30';mctx.lineWidth=5;mctx.stroke();mctx.strokeStyle='#b4a98a';mctx.lineWidth=3;mctx.stroke();mctx.setLineDash([3,4]);mctx.strokeStyle='#e7d9ad';mctx.lineWidth=.7;mctx.stroke();mctx.setLineDash([]);};
  const c1={x:AR*.4,z:AR*.3},c2={x:-AR*.35,z:-AR*.45},c3={x:AR*.25,z:-AR*.4};
  road(0,0,c1.x,c1.z);road(0,0,c2.x,c2.z);road(0,0,c3.x,c3.z);road(c1.x,c1.z,c3.x,c3.z);
  // Settlement blocks, visible even when no enemies are nearby.
  const town=(c,seed)=>{const x=tx(c.x),y=tz(c.z);mctx.fillStyle='#b8a17a';mctx.beginPath();mctx.ellipse(x,y,13,10,.2,0,Math.PI*2);mctx.fill();
    for(let i=0;i<9;i++){const a=i*2.399+seed,rx=Math.cos(a)*(5+(i%3)*2),ry=Math.sin(a)*(4+(i%2)*2);mctx.fillStyle=['#d6c8a7','#8d9aa0','#a5b1a0'][i%3];mctx.fillRect(x+rx-1.7,y+ry-1.7,3.4,3.4);}};
  town(c1,1);town(c2,2);town(c3,3);
  // The floating island and house are shown as a distinct landmark at map centre.
  mctx.beginPath();mctx.arc(tx(0),tz(-3),Math.max(5,47*sc),0,Math.PI*2);mctx.fillStyle='rgba(120,206,224,.3)';mctx.fill();mctx.strokeStyle='#8be9ff';mctx.lineWidth=1.4;mctx.stroke();
  mctx.fillStyle='#f3d9a0';mctx.fillRect(tx(-6),tz(-8),12*sc,10*sc);
  // Storm/safe zone.
  if(S){mctx.beginPath();mctx.arc(tx(0),tz(0),Math.max(1,S.r*sc),0,Math.PI*2);mctx.fillStyle='rgba(124,58,237,.12)';mctx.fill();mctx.strokeStyle='#e9d5ff';mctx.lineWidth=1.3;mctx.stroke();}
  // Enemies are red; dropped/loot markers are gold.
  mctx.fillStyle='#ff514b';for(const b of bots){if(b.hp<=0||b.phase==='bus')continue;mctx.beginPath();mctx.arc(tx(b.x),tz(b.z),2.5,0,Math.PI*2);mctx.fill();}
  if(typeof chests!=='undefined'){mctx.fillStyle='#ffd34e';for(const c of chests){if(c.m&&c.m.visible){mctx.beginPath();mctx.arc(tx(c.x),tz(c.z),1.6,0,Math.PI*2);mctx.fill();}}}
  // Player arrow points along the current look/aim vector, not the movement direction.
  if(S&&S.p.hp>0){const p=S.p,px=tx(p.x),pz=tz(p.z),a=Math.atan2(p.ax,-p.az);
    mctx.save();mctx.translate(px,pz);mctx.rotate(a);
    mctx.shadowColor='#07152b';mctx.shadowBlur=4;mctx.fillStyle='#2d7dff';mctx.strokeStyle='#fff';mctx.lineWidth=1.2;
    mctx.beginPath();mctx.moveTo(0,-8);mctx.lineTo(5.5,5);mctx.lineTo(0,2.5);mctx.lineTo(-5.5,5);mctx.closePath();mctx.fill();mctx.stroke();mctx.restore();}
  // Subtle frame and compass tick marks.
  mctx.strokeStyle='rgba(255,255,255,.45)';mctx.lineWidth=1;mctx.strokeRect(.5,.5,Wm-1,Hm-1);
  mctx.fillStyle='#fff';mctx.font='bold 10px sans-serif';mctx.textAlign='center';mctx.fillText('N',Wm/2,11);
}
